<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laila Noor | Art & Digital Archive</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f1eb;
  color: #29251f;
  font-family: Georgia, serif;
}

header {
  padding: 65px 20px 45px;
  text-align: center;
}

header h1 {
  font-size: 42px;
  font-weight: normal;
  letter-spacing: 3px;
  margin: 0 0 12px;
}

header p {
  font-family: Arial, sans-serif;
  font-size: 13px;
  letter-spacing: 3px;
  color: #81776b;
  text-transform: uppercase;
}

.line {
  width: 55px;
  border-top: 1px solid #b8a995;
  margin: 30px auto;
}

.intro {
  text-align: center;
  font-size: 17px;
  color: #6e655b;
  margin: 0 20px 45px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 35px;
  max-width: 1100px;
  margin: auto;
  padding: 0 30px 70px;
}

.card {
  text-align: center;
}

.card a {
  color: inherit;
  text-decoration: none;
}

.card img {
  width: 100%;
  height: 300px;
  object-fit: contain;
  background: #e9e3da;
  transition: transform 0.3s ease;
}

.card img:hover {
  transform: scale(1.02);
}

.card h3 {
  font-size: 21px;
  font-weight: normal;
  margin-top: 18px;
}

footer {
  text-align: center;
  padding: 25px;
  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 1px;
  color: #81776b;
}
</style>
</head>

<body>

<header>
  <h1>Laila Noor</h1>
  <p>Art · Design · Digital Experiments</p>
  <div class="line"></div>
</header>

<div class="intro">
  A collection of artworks, ideas and visual explorations.
</div>

<div class="gallery">

  <div class="card">
    <a href="aliens.html">
      <img src="Aliens.PNG" alt="Aliens Artwork">
      <h3>Aliens</h3>
    </a>
  </div>

  <div class="card">
    <a href="bold.html">
      <img src="Bold.PNG" alt="Bold Artwork">
      <h3>Bold</h3>
    </a>
  </div>

  <div class="card">
    <a href="concert.html">
      <img src="Concert.PNG" alt="Concert Artwork">
      <h3>Concert</h3>
    </a>
  </div>

</div>

<footer>
  © Laila Noor · Digital Art Archive
</footer>

</body>
</html>
