
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laila Noor | Portfolio</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: #f5f5f5;
  font-family: Georgia, serif;
}

header {
  padding: 80px 20px 45px;
  text-align: center;
}

header h1 {
  font-size: 44px;
  font-weight: normal;
  letter-spacing: 4px;
  margin: 0 0 15px;
}

header p {
  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 4px;
  color: #aaa;
  text-transform: uppercase;
}

.line {
  width: 60px;
  border-top: 1px solid #777;
  margin: 30px auto;
}

.intro {
  text-align: center;
  font-size: 17px;
  color: #aaa;
  margin: 0 20px 55px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 35px;
  max-width: 1050px;
  margin: auto;
  padding: 0 30px 90px;
}

.card {
  text-align: center;
}

.card a {
  color: white;
  text-decoration: none;
}

.card img {
  width: 100%;
  height: 340px;
  object-fit: contain;
  background: #292929;
  padding: 10px;
  transition: transform 0.3s ease;
}

.card img:hover {
  transform: scale(1.03);
}

.card h3 {
  font-size: 21px;
  font-weight: normal;
  letter-spacing: 1px;
  margin-top: 20px;
}

footer {
  text-align: center;
  padding: 40px 20px;
  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
  color: #777;
}

@media (max-width: 600px) {
  header h1 {
    font-size: 34px;
  }

  .gallery {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>Laila Noor</h1>
  <p>Art · Design · Digital Experiments</p>
  <div class="line"></div>
</header>

<div class="intro">
  A collection of artworks, ideas and creative explorations.
</div>

<div class="gallery">

  <div class="card">
    <a href="digitalart.html">
      <img src="thesis.PNG" alt="Thesis Art">
      <h3>Thesis </h3>
    </a>
  </div>

  <div class="card">
    <a href="ar.html">
      <img src="thought.PNG" alt="AR and Interactive Art">
      <h3>AR & Interactive Art</h3>
    </a>
  </div>

  <div class="card">
    <a href="fashion.html">
      <img src="Fashion.PNG" alt="Fashion Design">
      <h3>Fashion</h3>
    </a>
  </div>

</div>

<footer>
  © LAILA NOOR · DIGITAL ART ARCHIVE
</footer>

</body>
</html>
