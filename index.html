<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laila Noor | Digital Art Archive</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: #f5f5f5;
  font-family: Georgia, serif;
}

header {
  padding: 70px 20px 45px;
  text-align: center;
}

header h1 {
  font-size: 44px;
  font-weight: normal;
  letter-spacing: 4px;
  margin: 0 0 15px;
}

header p {
  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 4px;
  color: #aaa;
  text-transform: uppercase;
}

.line {
  width: 60px;
  border-top: 1px solid #777;
  margin: 30px auto;
}

.intro {
  text-align: center;
  font-size: 17px;
  color: #aaa;
  margin: 0 20px 50px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 35px;
  max-width: 1100px;
  margin: auto;
  padding: 0 30px 75px;
}

.card {
  text-align: center;
}

.card a {
  color: white;
  text-decoration: none;
}

.card img {
  width: 100%;
  height: 300px;
  object-fit: contain;
  background: #292929;
  padding: 10px;
  transition: transform 0.3s ease;
}

.card img:hover {
  transform: scale(1.03);
}

.card h3 {
  font-size: 21px;
  font-weight: normal;
  letter-spacing: 1px;
  margin-top: 18px;
}

footer {
  text-align: center;
  padding: 30px;
  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h1>Laila Noor</h1>
  <p>Art · Design · Digital Experiments</p>
  <div class="line"></div>
</header>

<div class="intro">
  A collection of artworks, ideas and visual explorations.
</div>

<div class="gallery">

  <div class="card">
    <a href="aliens.html">
      <img src="Aliens.PNG" alt="Aliens Artwork">
      <h3>Aliens</h3>
    </a>
  </div>

  <div class="card">
  <a href="stress.html">
    <img src="Stress.PNG" alt="Stress Artwork">
    <h3>Stress</h3>
  </a>
</div>
  
  <div class="card">
    <a href="bold.html">
      <img src="Bold.PNG" alt="Bold Artwork">
      <h3>Bold</h3>
    </a>
  </div>

  <div class="card">
    <a href="concert.html">
      <img src="Concert.PNG" alt="Concert Artwork">
      <h3>Concert</h3>
    </a>
  </div>

  <div class="card">
  <a href="curves.html">
    <img src="Curves.PNG" alt="Curves Artwork">
    <h3>Curves</h3>
    </a>  
  </div>

  <div class="card">
  <a href="depression.html">
    <img src="Depression.PNG" alt="Depression Artwork">
    <h3>Depression</h3>
  </a>
</div>
  
</div>

<footer>
  © LAILA NOOR · DIGITAL ART ARCHIVE
</footer>

</body>
</html>
